name: Brute integration checks
on:
  push:
    branches: ['feat/brute-animation']
    paths:
      - 'brute_review/**'
      - '.github/workflows/brute-integration.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Fetch exact public source
        shell: bash
        run: |
          set -euo pipefail
          git init .
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git fetch --depth=1 origin "${GITHUB_SHA}"
          git checkout --detach FETCH_HEAD
      - name: Install existing pinned checksum-verified engine
        run: python3 tools/install_ci_godot.py /tmp/brute-godot
      - name: Import real brute images and run all regression suites
        run: python3 brute_review/verify.py /tmp/brute-godot/godot
      - name: Attach brute art and evidence, excluding all fixture artwork
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: brute-evidence
          path: brute_evidence/
          retention-days: 14
          if-no-files-found: error
# Read-only checks. No merges, source pushes, approvals or releases.
