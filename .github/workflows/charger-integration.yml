name: Charger integration checks
on:
  push:
    branches: ['feat/charger-animation']
    paths:
      - 'charger_review/**'
      - '.github/workflows/charger-integration.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Fetch the exact public source
        shell: bash
        run: |
          set -euo pipefail
          git init .
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git fetch --depth=1 origin "${GITHUB_SHA}"
          git checkout --detach FETCH_HEAD
      - name: Install the pinned checksum-verified engine
        run: python3 tools/install_ci_godot.py /tmp/charger-godot
      - name: Import actual charger frames and run all regression checks
        run: python3 charger_review/verify.py /tmp/charger-godot/godot
      - name: Attach actual charger art and evidence without fixture artwork
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: charger-evidence
          path: charger_evidence/
          retention-days: 14
          if-no-files-found: error
# Read-only checks; no merges, new approval, release publication or gameplay changes.
