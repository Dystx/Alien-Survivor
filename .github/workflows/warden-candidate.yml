name: Warden candidate
on:
  push:
    branches: ['assets/official-pack-v1']
    paths:
      - 'assets/pack_v1/source/warden_family.py'
      - 'assets/pack_v1/source/check_warden.py'
      - '.github/workflows/warden-candidate.yml'
permissions:
  contents: read
concurrency:
  group: warden-candidate-only
  cancel-in-progress: false
jobs:
  render:
    if: github.ref == 'refs/heads/assets/official-pack-v1'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    permissions:
      contents: write
    env:
      LIBGL_ALWAYS_SOFTWARE: '1'
      OPENBLAS_NUM_THREADS: '1'
    steps:
      - name: Fetch the exact public source
        shell: bash
        run: |
          set -euo pipefail
          git init .
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git fetch --depth=1 origin "${GITHUB_SHA}"
          git checkout --detach FETCH_HEAD
          git ls-tree -r HEAD -- assets/pack_v1/families/player assets/pack_v1/families/runner assets/pack_v1/families/spitter assets/pack_v1/families/charger assets/pack_v1/families/brute assets/pack_v1/player_visual_lock.json > /tmp/protected-before
      - name: Install the existing pinned authoring dependencies
        run: |
          python3 -m venv /tmp/warden-venv
          /tmp/warden-venv/bin/python -m pip install -r assets/pack_v1/source/requirements.txt
      - name: Render and check actual Warden frames
        run: |
          xvfb-run -a /tmp/warden-venv/bin/python assets/pack_v1/source/warden_family.py --out /tmp/warden-candidate
          /tmp/warden-venv/bin/python assets/pack_v1/source/check_warden.py /tmp/warden-candidate
          /tmp/warden-venv/bin/python assets/pack_v1/source/warden_family.py --record /tmp/warden-candidate
          /tmp/warden-venv/bin/python tools/artpack.py audit
          /tmp/warden-venv/bin/python tools/artpack.py check-family brood_warden
          /tmp/warden-venv/bin/python -m unittest discover -s tests -p 'test_artpack*.py' -v
      - name: Commit candidate binaries only with protected-family checks
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          target='assets/official-pack-v1'
          test "$(git ls-remote origin "refs/heads/$target" | cut -f1)" = "$GITHUB_SHA" || { echo 'Concurrent change: no push'; exit 1; }
          git add -- assets/pack_v1/families/brood_warden
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'art: publish Warden candidate, 240 real frames and editable master'
          git ls-tree -r HEAD -- assets/pack_v1/families/player assets/pack_v1/families/runner assets/pack_v1/families/spitter assets/pack_v1/families/charger assets/pack_v1/families/brute assets/pack_v1/player_visual_lock.json > /tmp/protected-after
          cmp /tmp/protected-before /tmp/protected-after
          auth=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $auth" push origin "HEAD:refs/heads/$target"
          echo "WARDEN_COMMIT=$(git rev-parse HEAD)"
# No force-push, merge, player render, artwork approval or release publication.
